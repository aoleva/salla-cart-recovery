<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  >

  <meta
    name="referrer"
    content="no-referrer"
  >

  <title>
    إدارة تطبيق استعادة السلات
  </title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

  <div class="app-shell">

    <!-- ========================================
         Header
    ========================================= -->

    <header class="topbar">

      <div>

        <h1>
          إدارة التطبيق
        </h1>

        <p>
          تجهيز WhatsApp لكل متجر
        </p>

      </div>

      <div
        class="status-badge status-online"
        aria-label="صفحة الإدارة"
      >
        Admin
      </div>

    </header>


    <main class="dashboard">


      <!-- ========================================
           Admin Key
      ========================================= -->

      <section class="card">

        <div class="card-header">

          <div>

            <h2>
              دخول الإدارة
            </h2>

            <p>
              هذه الصفحة مخصصة للإدارة فقط،
              والتاجر لن يرى بيانات UltraMsg السرية.
            </p>

          </div>

        </div>


        <div class="form-group">

          <label for="adminKey">
            Admin Key
          </label>

          <input
            id="adminKey"
            name="adminKey"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="أدخل Admin Key"
          >

        </div>


        <div
          class="actions"
          style="margin-top:16px"
        >

          <button
            id="loadStores"
            class="btn btn-secondary"
            type="button"
          >
            عرض المتاجر المسجلة
          </button>

        </div>


        <div
          id="storesArea"
          class="hidden"
          style="margin-top:20px"
        >

          <h3>
            المتاجر
          </h3>

          <div
            id="storesList"
            aria-live="polite"
          ></div>

        </div>

      </section>



      <!-- ========================================
           تجهيز UltraMsg
      ========================================= -->

      <section class="card">

        <div class="card-header">

          <div>

            <h2>
              تجهيز WhatsApp للمتجر
            </h2>

            <p>
              أدخل بيانات UltraMsg الخاصة بالمتجر مرة واحدة،
              وبعدها يستطيع التاجر ربط WhatsApp من خلال QR.
            </p>

          </div>

        </div>


        <div class="form-grid">


          <!-- Merchant ID -->

          <div class="form-group">

            <label for="merchantId">
              Merchant ID من سلة
            </label>

            <input
              id="merchantId"
              name="merchantId"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              placeholder="مثال: 123456789"
            >

          </div>


          <!-- UltraMsg Instance -->

          <div class="form-group">

            <label for="instanceId">
              UltraMsg Instance ID
            </label>

            <input
              id="instanceId"
              name="instanceId"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              placeholder="مثال: 189061"
            >

          </div>


          <!-- UltraMsg Token -->

          <div class="form-group full">

            <label for="token">
              UltraMsg Token
            </label>

            <input
              id="token"
              name="token"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="Token"
            >

          </div>

        </div>


        <div
          class="actions"
          style="margin-top:20px"
        >

          <button
            id="save"
            class="btn btn-primary btn-large"
            type="button"
          >
            تجهيز المتجر
          </button>

        </div>


        <!-- ========================================
             Result
        ========================================= -->

        <div
          id="result"
          class="preview-box hidden"
          aria-live="polite"
        >

          <div class="preview-title">
            النتيجة
          </div>

          <pre
            id="resultText"
            style="
              white-space:pre-wrap;
              direction:ltr;
              text-align:left;
              overflow:auto;
            "
          ></pre>

        </div>

      </section>


    </main>

  </div>


  <!-- ========================================
       Admin JavaScript
  ========================================= -->

  <script src="/admin.js"></script>

</body>

</html>
