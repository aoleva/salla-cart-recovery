# Paid, always-on resources. Review Render's cost estimate before deploying.
services:
  - type: web
    name: salla-cart-recovery
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    buildCommand: npm ci --omit=dev && npm run check
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DEV_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: salla-cart-recovery-db
          property: connectionString
      - key: SALLA_APP_ID
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true

databases:
  - name: salla-cart-recovery-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: salla_cart_recovery
    user: salla_cart_recovery
    ipAllowList: []
