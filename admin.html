<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة استعادة السلات</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="container" style="max-width:900px">
  <section class="card">
    <p class="eyebrow">إدارة التطبيق</p>
    <h1>تجهيز WhatsApp للمتجر</h1>
    <p class="muted">هذه الصفحة لك أنت فقط. التاجر لا يرى UltraMsg Instance أو Token؛ بعد التجهيز سيرى زر «ربط WhatsApp» والـQR فقط.</p>
    <label>Admin Key<input id="adminKey" type="password" autocomplete="current-password"></label>
    <button id="loadStores" class="btn secondary">عرض المتاجر المسجلة</button>
    <div id="storesArea" class="hidden" style="margin-top:16px">
      <h2>المتاجر</h2>
      <div id="storesList"></div>
    </div>
  </section>

  <section class="card" style="margin-top:18px">
    <h2>تخصيص UltraMsg Instance</h2>
    <label>Merchant ID من سلة<input id="merchantId" type="text" inputmode="numeric"></label>
    <label>UltraMsg Instance ID<input id="instanceId" type="text" placeholder="مثال: 189061"></label>
    <label>UltraMsg Token<input id="token" type="password" autocomplete="off"></label>
    <button id="save" class="btn primary wide">تجهيز المتجر</button>
    <pre id="result" class="message-preview" style="margin-top:16px;direction:ltr;text-align:left"></pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const adminHeaders = () => ({ 'Content-Type': 'application/json', 'x-admin-key': $('adminKey').value });

$('loadStores').onclick = async () => {
  const area = $('storesArea');
  const list = $('storesList');
  try {
    const r = await fetch('/admin/api/stores', { headers: adminHeaders() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || `HTTP ${r.status}`);
    area.classList.remove('hidden');
    if (!d.stores.length) {
      list.innerHTML = '<p class="muted">لا توجد متاجر مسجلة بعد. ثبّت/أعد تفويض التطبيق على المتجر التجريبي أولًا.</p>';
      return;
    }
    list.innerHTML = '';
    d.stores.forEach((store) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'btn secondary';
      row.style.cssText = 'width:100%;margin:6px 0;text-align:right';
      row.textContent = `${store.storeName || 'متجر'} — Merchant ${store.merchantId} — ${store.whatsappProvisioned ? 'WhatsApp مجهز' : 'غير مجهز'}`;
      row.onclick = () => { $('merchantId').value = store.merchantId; window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); };
      list.appendChild(row);
    });
  } catch (e) {
    area.classList.remove('hidden');
    list.textContent = e.message;
  }
};

$('save').onclick = async () => {
  const result = $('result');
  result.textContent = 'جاري التحقق والحفظ...';
  try {
    const r = await fetch('/admin/api/provision-whatsapp', {
      method:'POST',
      headers: adminHeaders(),
      body: JSON.stringify({ merchantId: $('merchantId').value, instanceId: $('instanceId').value, token: $('token').value })
    });
    const d = await r.json();
    result.textContent = JSON.stringify(d, null, 2);
    if (r.ok) $('token').value = '';
  } catch(e) { result.textContent = e.message; }
};
</script>
</body>
</html>
